<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒数日</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="top-section">
        <button class="settings-button" id="settings-button" type="button">距离 2027 年 1 月 21 日</button>
        <div class="big-countdown"><span id="days-left">--</span><span class="unit">天</span></div>
        <div class="current-time">当前时间：<span id="current-time-text"></span></div>
    </div>

    <div class="bottom-section">
        <div class="progress-wrapper">
            <div class="progress-bar-container">
                <div class="progress-bar" id="total-progress"></div>
            </div>
        </div>
        <div class="grid-container" id="calendar-grid">
            <!-- 卡片由JS动态生成 -->
        </div>
        <div class="progress-text" id="total-progress-text">--%</div>
    </div>

    <div class="modal" id="settings-modal" aria-hidden="true">
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <h2 id="settings-title">设置倒计时日期</h2>
            <form id="settings-form">
                <label for="start-date-input">开始日期</label>
                <input id="start-date-input" type="date" required>

                <label for="end-date-input">结束日期</label>
                <input id="end-date-input" type="date" required>

                <p class="date-error" id="date-error" role="alert"></p>

                <div class="modal-actions">
                    <button type="button" id="reset-settings">恢复默认</button>
                    <button type="button" id="cancel-settings">取消</button>
                    <button type="submit" class="primary-button">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
